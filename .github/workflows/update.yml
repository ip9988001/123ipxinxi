name: update-ip-data

on:
  schedule:
    - cron: '23 4 * * *'      # 每日 UTC 04:23 = 北京 12:23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载公开数据源
        run: |
          set -e
          B=https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output
          curl -sSf -o dc4.txt    "$B/datacenter/ipv4.txt"
          curl -sSf -o dc6.txt    "$B/datacenter/ipv6.txt"
          curl -sSf -o vpn4.txt   "$B/vpn/ipv4.txt"
          curl -sSf -o vpn6.txt   "$B/vpn/ipv6.txt"
          curl -sSf -o cf4.txt    https://www.cloudflare.com/ips-v4
          curl -sSf -o cf6.txt    https://www.cloudflare.com/ips-v6
          curl -sSf -o aws.json   https://ip-ranges.amazonaws.com/ip-ranges.json
          curl -sSf -o gcp.json   https://www.gstatic.com/ipranges/cloud.json
          curl -sSf -o ipsum.txt  https://raw.githubusercontent.com/stamparm/ipsum/master/ipsum.txt
          curl -sSf -o drop.txt   https://www.spamhaus.org/drop/drop.txt
          curl -sSf -o firehol_level1.netset https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset
          curl -sSf -o ip2asn-v4.tsv.gz https://iptoasn.com/data/ip2asn-v4.tsv.gz && gunzip -f ip2asn-v4.tsv.gz
          curl -sSf -o ip2asn-v6.tsv.gz https://iptoasn.com/data/ip2asn-v6.tsv.gz && gunzip -f ip2asn-v6.tsv.gz
          curl -sSf -o nro-delegated-stats https://ftp.ripe.net/pub/stats/ripencc/nro-stats/latest/nro-delegated-stats
          ls -la *.txt *.json | awk '{print $5, $9}'

      - name: 编译
        run: |
          python3 scripts/build_ipseg.py
          python3 scripts/build_risk.py
          python3 scripts/build_asn.py
          ls -la data/ | head -20
          du -sh data data/asn

      - name: 发布数据到 data 分支（每次单 commit 覆盖，仓库不膨胀）
        run: |
          mkdir -p /tmp/pub && cp -r data/. /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name  "123ip-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -qm "data: $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -qf origin data
          echo "已发布到 data 分支"

      - name: 更新统计到 main（仅 stats 文件）
        run: |
          git config user.name  "123ip-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/stats.json data/asn_stats.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "统计无变化"; else
            git commit -m "stats: $(date -u +%F)"; git push; fi

      - name: 同步到 Cloudflare KV
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_KEY:   ${{ secrets.CF_API_KEY }}
          CF_ACC:   ${{ secrets.CF_ACCOUNT_ID }}
          KV_IPSEG: ${{ secrets.KV_IPSEG }}
          KV_RISK:  ${{ secrets.KV_RISK }}
        run: bash scripts/push_kv.sh
